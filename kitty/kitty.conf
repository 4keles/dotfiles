# vim:fileencoding=utf-8:foldmethod=marker

# ── Tema ─────────────────────────────────────────────────────────────────────
# BEGIN_KITTY_THEME
# Forest Night
include current-theme.conf
# END_KITTY_THEME

# ── Shell ─────────────────────────────────────────────────────────────────────
shell zsh
shell_integration enabled

# ── Font ──────────────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        12.0

# Ligature ayarı
disable_ligatures never

# ── Pencere görünümü ──────────────────────────────────────────────────────────
# Şeffaflık (0.0 = tam şeffaf, 1.0 = opak)
background_opacity 0.88
dynamic_background_opacity yes

# Padding
window_padding_width 12

# Kenarlık ve köşeler
hide_window_decorations no

# Blur (compositor destekliyorsa çalışır - KDE/GNOME)
background_blur 8

# ── Renk ──────────────────────────────────────────────────────────────────────
# Seçim
selection_foreground none
selection_background #485b66

# URL vurgusu
url_color #bdd0e5
url_style curly

# İmleç
cursor_shape block
cursor_blink_interval 0.5
cursor_stop_blinking_after 10.0

# ── Tab bar ───────────────────────────────────────────────────────────────────
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 1
tab_bar_edge bottom
active_tab_font_style bold
inactive_tab_font_style normal
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}: {title[:20]}"

# ── Scrollback ────────────────────────────────────────────────────────────────
# Bellekte tutulan satır sayısı (RAM kullanır, 0 = sınırsız)
scrollback_lines 50000
# Diske yazılan pager geçmişi (MB) - büyük dosya çıktıları için
scrollback_pager_history_size 100
# Scrollback pager olarak less kullan (arama, navigasyon destekli)
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# ── Performans ────────────────────────────────────────────────────────────────
repaint_delay 10
input_delay 3
sync_to_monitor yes

# ── Klavye kısayolları ────────────────────────────────────────────────────────
# Scroll (geçmiş çıktılara bakma)
map ctrl+shift+up       scroll_line_up
map ctrl+shift+down     scroll_line_down
map ctrl+shift+j        scroll_line_down
map ctrl+shift+page_up  scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+home     scroll_home
map ctrl+shift+end      scroll_end

# Tab yönetimi
map ctrl+shift+t    new_tab_with_cwd
map ctrl+shift+w    close_tab
map ctrl+shift+l    next_tab
map ctrl+shift+h    previous_tab
# Tüm scrollback'i less'te aç (büyük çıktılarda kullan)
map ctrl+shift+s    show_scrollback
# Son komutun çıktısını aç
map ctrl+shift+g    show_last_command_output
map ctrl+shift+.    move_tab_forward
map ctrl+shift+,    move_tab_backward
map ctrl+shift+alt+t set_tab_title

# Bölme (split)
map ctrl+shift+enter    new_window_with_cwd
map ctrl+shift+]        next_window
map ctrl+shift+[        previous_window

# Font boyutu
map ctrl+shift+equal    change_font_size all +1.0
map ctrl+shift+minus    change_font_size all -1.0
map ctrl+shift+0        change_font_size all 0

# Şeffaflık klavyeyle ayarla
map ctrl+shift+a>m    set_background_opacity +0.05
map ctrl+shift+a>l    set_background_opacity -0.05
map ctrl+shift+a>1    set_background_opacity 1
map ctrl+shift+a>d    set_background_opacity default

# Kopyala/yapıştır
map ctrl+shift+c    copy_to_clipboard
map ctrl+shift+v    paste_from_clipboard

# ── Mouse ─────────────────────────────────────────────────────────────────────
mouse_hide_wait 3.0
focus_follows_mouse no
open_url_with default

# ── Bell ──────────────────────────────────────────────────────────────────────
enable_audio_bell no
visual_bell_duration 0.1
visual_bell_color #fd8489

# ── Misc ──────────────────────────────────────────────────────────────────────
update_check_interval 0
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask
# allow_remote_control yes
# listen_on unix:/tmp/mykitty
